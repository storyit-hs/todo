<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>지뢰찾기 · MINE FIELD</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff3ee;color:#203c32;font-family:system-ui,-apple-system,'맑은 고딕',sans-serif;min-height:100vh;padding:36px 18px}main{max-width:840px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:3px;color:#6b8174;font-weight:700}h1{font-size:38px;letter-spacing:-2px;margin:8px 0}header p{color:#6b8174;font-size:14px}.badge{border:1px solid #c9d5c9;border-radius:30px;padding:10px 16px;font-size:12px;white-space:nowrap}.panel{background:#fff;border:1px solid #dfe6dc;border-radius:24px;padding:26px;box-shadow:0 15px 45px #223c3210}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}button,select{font:inherit}select,.action{border:1px solid #d7e0d5;border-radius:10px;padding:10px 14px;background:#f7f9f5;color:#203c32;cursor:pointer}.action.primary{background:#203c32;color:white;border-color:#203c32}.action[aria-pressed=true]{background:#e8b958;color:#203c32;border-color:#e8b958}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{padding:14px;background:#f4f7f1;border-radius:12px}.stat small{display:block;color:#77887a;font-size:11px;margin-bottom:6px}.stat strong{font-size:24px;font-variant-numeric:tabular-nums}#status{color:#6b8174;font-size:14px;margin:18px 0;min-height:22px}.board-wrap{overflow:auto;padding:4px 0 12px}#board{display:grid;gap:4px;width:max-content;margin:auto}.cell{width:36px;height:36px;border:0;border-radius:7px;background:#dce6d6;box-shadow:inset 0 -3px 0 #c4d2be;color:#203c32;font-size:19px;font-weight:800;cursor:pointer;padding:0;touch-action:manipulation}.cell:hover{background:#cbdcc4}.cell:focus-visible{outline:3px solid #e5a83d;outline-offset:1px}.cell.open{background:#f0f4eb;box-shadow:none;cursor:default}.cell.mine{background:#ffe3db}.cell.hit{background:#ee947a}.cell.flag{background:#ffedbf}.cell[data-n='1']{color:#3880b7}.cell[data-n='2']{color:#459669}.cell[data-n='3']{color:#da7057}.cell[data-n='4']{color:#8365b2}.cell[data-n='5'],.cell[data-n='6'],.cell[data-n='7'],.cell[data-n='8']{color:#ad5040}.help{display:flex;flex-wrap:wrap;gap:12px 24px;border-top:1px solid #e5ebe1;margin-top:15px;padding-top:20px;color:#77887a;font-size:12px}footer{text-align:center;color:#859185;font-size:12px;padding:22px} @media(max-width:520px){body{padding:24px 12px}.panel{padding:18px}h1{font-size:30px}.badge{display:none}.cell{width:31px;height:31px}.stats{gap:8px}.stat{padding:12px}.action,select{padding:10px}.toolbar{align-items:center}}
</style></head><body><main><header><div><div class="eyebrow">A LITTLE BREAK, A SHARP MIND</div><h1>지뢰찾기 🌿</h1><p>한 칸씩, 차분하게. 숨은 지뢰를 찾아보세요.</p></div><span class="badge">첫 클릭은 안전해요</span></header><section class="panel"><div class="toolbar"><select id="difficulty" aria-label="난이도"><option value="easy">초급 · 9 × 9</option><option value="medium">중급 · 16 × 16</option><option value="hard">고급 · 30 × 16</option></select><div><button class="action" id="flagMode" aria-pressed="false">⚑ 깃발 모드</button> <button class="action primary" id="restart">↻ 새 게임</button></div></div><div class="stats"><div class="stat"><small>남은 지뢰</small><strong id="remaining">10</strong></div><div class="stat"><small>플레이 시간</small><strong id="timer">0초</strong></div><div class="stat"><small>최고 기록</small><strong id="best">—</strong></div></div><p id="status" role="status" aria-live="polite"></p><div class="board-wrap"><div id="board" role="group" aria-label="지뢰찾기 게임판"></div></div><div class="help"><span>클릭 / 터치 : 칸 열기</span><span>우클릭 / 깃발 모드 : 깃발 표시</span><span>숫자 : 주변 8칸의 지뢰 개수</span><span>숫자 칸 클릭 : 깃발 개수가 맞으면 주변 열기</span></div></section><footer>작은 휴식, 즐거운 도전. MINE FIELD</footer></main><script>
'use strict';
const $=id=>document.getElementById(id),levels={easy:[9,9,10],medium:[16,16,40],hard:[16,30,99]};
let rows,cols,mines,cells,started,ended,flags,opened,elapsed,interval,startTime,flagMode=false;
function neighbors(i){const r=Math.floor(i/cols),c=i%cols,out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if((dr||dc)&&nr>=0&&nr<rows&&nc>=0&&nc<cols)out.push(nr*cols+nc)}return out}
function bestRead(){try{return localStorage.getItem('mine-best-'+$('difficulty').value)}catch{return null}}
function reset(){clearInterval(interval);[rows,cols,mines]=levels[$('difficulty').value];started=false;ended=false;flags=opened=elapsed=0;cells=Array.from({length:rows*cols},()=>({mine:false,n:0,open:false,flag:false}));$('timer').textContent='0초';$('remaining').textContent=mines;const b=bestRead();$('best').textContent=b===null?'—':b+'초';$('status').textContent='아무 칸이나 눌러 시작하세요. 첫 칸과 주변은 안전합니다.';const board=$('board');board.style.gridTemplateColumns=`repeat(${cols}, auto)`;board.replaceChildren();cells.forEach((cell,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='cell';btn.setAttribute('aria-label',`${Math.floor(i/cols)+1}행 ${i%cols+1}열, 닫힌 칸`);btn.addEventListener('click',()=>flagMode?toggleFlag(i):reveal(i));btn.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i)});cell.el=btn;board.append(btn)})}
function place(first){const safe=new Set([first,...neighbors(first)]),available=cells.map((_,i)=>i).filter(i=>!safe.has(i));for(let i=available.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[available[i],available[j]]=[available[j],available[i]]}available.slice(0,mines).forEach(i=>cells[i].mine=true);cells.forEach((c,i)=>c.n=neighbors(i).filter(j=>cells[j].mine).length);started=true;startTime=Date.now();interval=setInterval(()=>{elapsed=Math.floor((Date.now()-startTime)/1000);$('timer').textContent=elapsed+'초'},250);$('status').textContent='숫자를 단서로 지뢰를 피해 모든 안전한 칸을 열어보세요.'}
function paint(i){const c=cells[i];c.el.className='cell'+(c.open?' open':'')+(c.flag?' flag':'');c.el.textContent=c.flag?'⚑':c.open?(c.mine?'💣':c.n||''):'';c.el.dataset.n=c.n;c.el.setAttribute('aria-label',`${Math.floor(i/cols)+1}행 ${i%cols+1}열, ${c.flag?'깃발':c.open?(c.mine?'지뢰':c.n+'개의 인접 지뢰'):'닫힌 칸'}`)}
function toggleFlag(i){const c=cells[i];if(ended||c.open)return;if(!c.flag&&flags>=mines){$('status').textContent='깃발을 모두 사용했습니다. 기존 깃발을 해제해 주세요.';return}c.flag=!c.flag;flags+=c.flag?1:-1;paint(i);$('remaining').textContent=mines-flags}
function reveal(i){if(ended||cells[i].flag)return;if(cells[i].open){const near=neighbors(i);if(cells[i].n>0&&near.filter(j=>cells[j].flag).length===cells[i].n){for(const j of near){if(!cells[j].open&&!cells[j].flag)openArea(j);if(ended)break}checkWin()}return}if(!started)place(i);openArea(i);checkWin()}
function openArea(i){const queue=[i];while(queue.length&&!ended){const j=queue.pop(),c=cells[j];if(c.open||c.flag)continue;c.open=true;paint(j);if(c.mine){lose(j);return}opened++;if(c.n===0)neighbors(j).forEach(k=>{if(!cells[k].open&&!cells[k].flag)queue.push(k)})}}
function lose(hit){ended=true;clearInterval(interval);cells.forEach((c,i)=>{if(c.mine){c.open=true;paint(i);c.el.classList.add('mine')}else if(c.flag){c.el.textContent='✕';c.el.setAttribute('aria-label','잘못 표시한 깃발')}});cells[hit].el.classList.add('hit');$('status').textContent='💥 지뢰를 밟았어요! 새 게임으로 다시 도전해 보세요.'}
function checkWin(){if(ended||opened!==rows*cols-mines)return;ended=true;clearInterval(interval);elapsed=Math.floor((Date.now()-startTime)/1000);$('timer').textContent=elapsed+'초';cells.forEach((c,i)=>{if(c.mine){c.flag=true;paint(i)}});flags=mines;$('remaining').textContent=0;$('status').textContent='🎉 성공! 모든 안전한 칸을 찾았습니다. '+elapsed+'초 만에 클리어!';const old=bestRead();if(old===null||elapsed<Number(old)){try{localStorage.setItem('mine-best-'+$('difficulty').value,String(elapsed))}catch{}$('best').textContent=elapsed+'초'}}
$('restart').addEventListener('click',reset);$('difficulty').addEventListener('change',reset);$('flagMode').addEventListener('click',()=>{flagMode=!flagMode;$('flagMode').setAttribute('aria-pressed',String(flagMode))});reset();
</script></body></html>
